name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -W error -m compileall -q src
      - run: bash -n setup.sh
      - run: python scripts/bootstrap.py --prefix .venv && .venv/bin/waybridge setup --help
      - name: Reproducible archive and integrity
        run: |
          python scripts/release.py --output /tmp/waybridge-a.tar.gz
          python scripts/release.py --output /tmp/waybridge-b.tar.gz
          cmp /tmp/waybridge-a.tar.gz /tmp/waybridge-b.tar.gz
          mkdir /tmp/waybridge-release
          tar -xzf /tmp/waybridge-a.tar.gz -C /tmp/waybridge-release
          cd /tmp/waybridge-release/waybridge
          sha256sum -c SHA256SUMS

  browser-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - run: npm install --prefix /tmp/waybridge-browser playwright@1.62.1
      - run: /tmp/waybridge-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser DOM and export orchestration
        env:
          WAYBRIDGE_PLAYWRIGHT: /tmp/waybridge-browser/node_modules/playwright
          WAYBRIDGE_PAGE_FIXTURE: /tmp/waybridge-chromium-page.json
        run: node tests/browser-pages.cjs
      - name: Actual Firefox extension capture in isolated profile
        env:
          WAYBRIDGE_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          WAYBRIDGE_FIREFOX_FIXTURE: /tmp/waybridge-firefox-page.json
        run: node tests/firefox-pages.cjs
      - name: Validate browser-generated documents and package extension
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from waybridge.pages import validate
          for name in ('chromium','firefox'):
              validate(Path('/tmp/waybridge-'+name+'-page.json').read_bytes())
          PY
          python scripts/build-extension.py --output /tmp/waybridge-page-export-unsigned.xpi
