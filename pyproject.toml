[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waybridge"
version = "3.6.7"
description = "Explicitly controlled Wayland file and screenshot bridge over Tailscale"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
readme = "README.md"

[project.scripts]
waybridge = "waybridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waybridge = ["browser/firefox/*"]
